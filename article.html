
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cygnus | Article</title>
    <link rel="stylesheet" href="css/style.css">
    


<style>
    body {
        background:
            radial-gradient(ellipse at 10% 5%, rgba(45, 130, 75, 0.24), transparent 38%),
            radial-gradient(ellipse at 90% 85%, rgba(23, 107, 58, 0.18), transparent 35%),
            linear-gradient(145deg, #071b11, #102d1d 55%, #07170f);
        color: #1c2b21;
    }

    .article-page {
        position: relative;
        box-sizing: border-box;
        width: calc(100% - 40px);
        max-width: 820px;
        margin: 54px auto 76px;
        padding: 44px 52px;
        overflow: hidden;
        background: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 16px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
    }

    .article-page::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(90deg, #176b3a, #70b77c, #176b3a);
    }

    .article-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        color: #54705d;
        font-size: 0.85rem;
    }

    .article-meta span {
        display: inline-block;
    }

    .article-meta .article-category {
        padding: 6px 10px;
        background: #edf6ef;
        border-radius: 5px;
        color: #176b3a;
        font-weight: 600;
    }

    .article-page h1 {
        margin: 0 0 22px;
        color: #153c27;
        font-size: clamp(29px, 4vw, 42px);
        line-height: 1.2;
        letter-spacing: -0.7px;
        overflow-wrap: anywhere;
    }

    .article-cover {
        display: block;
        width: 100%;
        max-height: 420px;
        margin: 0 0 30px;
        object-fit: cover;
        border-radius: 10px;
    }

    .article-body {
        color: #35443a;
        font-size: 16px;
        line-height: 1.85;
        overflow-wrap: anywhere;
    }

    .article-body h2 {
        margin: 34px 0 12px;
        color: #17452b;
        font-size: 1.55rem;
        line-height: 1.35;
    }

    .article-body h3 {
        margin: 26px 0 10px;
        color: #17452b;
        font-size: 1.2rem;
    }

    .article-body p {
        margin: 0 0 20px;
    }

    .article-body ul,
    .article-body ol {
        margin: 0 0 22px;
        padding-left: 24px;
    }

    .article-body li {
        margin-bottom: 8px;
    }

    .article-body img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
    }

    .article-body blockquote {
        margin: 26px 0;
        padding: 12px 20px;
        border-left: 4px solid #23834b;
        background: #f3f8f4;
        color: #3e5c47;
    }

    .article-body a {
        color: #176b3a;
        text-decoration: underline;
        text-underline-offset: 3px;
    }

    .article-body a:hover {
        color: #0d4927;
    }

    .article-back-link {
        color: #176b3a;
        font-weight: 600;
        text-decoration: none;
    }

    .article-back-link:hover {
        text-decoration: underline;
    }

    .article-comments {
        margin-top: 48px;
        padding-top: 28px;
        border-top: 1px solid #e1e9e3;
    }

    .article-comments h2 {
        margin: 0 0 10px;
        color: #153c27;
        font-size: 1.5rem;
    }

    .article-comments p {
        color: #627268;
        line-height: 1.7;
    }

    @media (max-width: 600px) {
        .article-page {
            width: calc(100% - 24px);
            margin: 24px auto 40px;
            padding: 30px 22px;
            border-radius: 12px;
        }

        .article-page h1 {
            font-size: 29px;
        }

        .article-body {
            font-size: 15.5px;
        }
    }
</style>


</head>
<body>

    <main class="article-page" id="article">
        <p>Loading article...</p>
    
    </main>

    <section class="private-feedback">
        <h2>Send Private Feedback</h2>
        <p>Your message will be sent privately to the Cygnus team. It will not appear publicly on this article.</p>

        <form name="cygnus-article-feedback"
              method="POST"
              data-netlify="true"
              netlify-honeypot="bot-field">

            <input type="hidden" name="form-name"
                   value="cygnus-article-feedback">

            <p hidden>
                <label>Leave this field empty:
                    <input name="bot-field">
                </label>
            </p>

            <input type="hidden" name="article" id="feedback-article">

            <label for="feedback-name">Your name</label>
            <input id="feedback-name" type="text"
                   name="name" required>

            <label for="feedback-email">Your email</label>
            <input id="feedback-email" type="email"
                   name="email" required>

            <label for="feedback-message">Your feedback</label>
            <textarea id="feedback-message"
                      name="message" rows="5" required></textarea>

            <button type="submit">Send Feedback</button>
        </form>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
    async function loadArticle() {
        const container = document.getElementById("article");
        const slug = new URLSearchParams(window.location.search).get("slug");

        if (!slug) {
            showError("No article was selected.");
            return;
        }

        try {
            const response = await fetch("data/posts.json?v=" + Date.now(), {
    cache: "no-store"});

            if (!response.ok) {
                throw new Error("Could not load posts.");
            }

            const data = await response.json();
            const post = (data.posts || []).find(item => item.slug === slug);

            if (!post) {
                showError("This article could not be found.");
                return;
            }

            document.title = post.title + " | Cygnus";
            document.getElementById("feedback-article").value = post.title;

            const title = escapeHTML(post.title || "Untitled");
            const category = escapeHTML(post.category || "Insights");
            const date = post.date
                ? new Date(post.date).toLocaleDateString(undefined, {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                })
                : "";

            const cover = post.image
                ? `<img class="article-cover"
                     src="${escapeHTML(post.image)}"
                     alt="${title}">`
                : "";

            const rawBody = post.body || "";
            const cleanedBody = rawBody.replace(
                /^\s*#\s+.+(?:\r?\n)+/,
                ""
            );

const articleBody = window.marked
    ? marked.parse(cleanedBody)
    : `<p>${escapeHTML(cleanedBody)}</p>`;

            container.innerHTML = `
                <p class="article-meta">${category}${date ? " · " + escapeHTML(date) : ""}</p>
                <h1>${title}</h1>
                ${cover}
                <div class="article-body">${articleBody}</div>
                <a class="article-back-link" href="blog.html">← Back to Blog</a>
                <section id="comments" class="comments-section">
                    <h2>Join the Conversation</h2>
                    <p>Comments will be available here once the comment service is connected.</p>
                </section>
            `;
        } catch (error) {
            console.error(error);
            showError("We couldn't load this article. Please try again later.");
        }

        function showError(message) {
            container.innerHTML = `
                <div class="article-error">
                    <h1>Article unavailable</h1>
                    <p>${escapeHTML(message)}</p>
                    <a class="article-back-link" href="blog.html">Back to Blog</a>
                </div>
            `;
        }
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    loadArticle();
    </script>

</body>
</html>
