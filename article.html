
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cygnus | Article</title>
    <link rel="stylesheet" href="css/style.css">
    
<style>
    :root {
        --article-green: #176b3a;
        --article-dark: #15251b;
        --article-muted: #68746b;
        --article-border: #e4ebe5;
        --article-soft: #f4f8f4;
    }

    body {
        margin: 0;
        background: #f5f7f5;
        color: var(--article-dark);
        font-family: Arial, Helvetica, sans-serif;
    }

    .article-page {
        max-width: 900px;
        margin: 48px auto 80px;
        padding: 52px 64px;
        background: #ffffff;
        border: 1px solid var(--article-border);
        border-radius: 18px;
        box-shadow: 0 12px 40px rgba(20, 50, 30, 0.06);
    }

    .article-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        color: var(--article-green);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.5px;
        line-height: 1.6;
        text-transform: uppercase;
        margin: 0 0 22px;
    }

    .article-page h1 {
        color: var(--article-dark);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(34px, 5vw, 54px);
        font-weight: 700;
        letter-spacing: -1.4px;
        line-height: 1.12;
        margin: 0 0 24px;
    }

    .article-cover {
        display: block;
        width: 100%;
        max-height: 440px;
        object-fit: cover;
        border-radius: 12px;
        margin: 30px 0 38px;
    }

    .article-body {
        color: #354139;
        font-size: 17px;
        line-height: 1.9;
        overflow-wrap: anywhere;
    }

    .article-body h2 {
        color: var(--article-dark);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 29px;
        line-height: 1.3;
        margin: 42px 0 14px;
    }

    .article-body h3 {
        color: var(--article-dark);
        font-size: 21px;
        margin: 30px 0 12px;
    }

    .article-body p {
        margin: 0 0 23px;
    }

    .article-body strong {
        color: var(--article-dark);
    }

    .article-body ul,
    .article-body ol {
        margin: 0 0 25px;
        padding-left: 26px;
    }

    .article-body li {
        margin-bottom: 8px;
        padding-left: 4px;
    }

    .article-back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 38px;
        padding: 12px 18px;
        border: 1px solid var(--article-border);
        border-radius: 8px;
        color: var(--article-green);
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: background 0.2s ease, color 0.2s ease;
    }

    .article-back-link:hover {
        background: var(--article-green);
        color: #ffffff;
    }

    .comments-section {
        margin-top: 65px;
        padding-top: 32px;
        border-top: 1px solid var(--article-border);
    }

    .comments-section h2 {
        color: var(--article-dark);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 30px;
        margin: 0 0 12px;
    }

    .comments-section p {
        color: var(--article-muted);
        line-height: 1.7;
    }

    .article-error {
        padding: 60px 20px;
        text-align: center;
    }

    @media (max-width: 650px) {
        .article-page {
            margin: 18px 12px 40px;
            padding: 30px 22px;
            border-radius: 12px;
        }

        .article-page h1 {
            font-size: 36px;
            letter-spacing: -0.8px;
        }

        .article-body {
            font-size: 16px;
            line-height: 1.8;
        }

        .article-body h2 {
            font-size: 25px;
            margin-top: 32px;
        }

        .article-cover {
            margin: 24px 0 28px;
        }
    }
</style>

</head>
<body>

    <main class="article-page" id="article">
        <p>Loading article...</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
    async function loadArticle() {
        const container = document.getElementById("article");
        const slug = new URLSearchParams(window.location.search).get("slug");

        if (!slug) {
            showError("No article was selected.");
            return;
        }

        try {
            const response = await fetch("data/posts.json");

            if (!response.ok) {
                throw new Error("Could not load posts.");
            }

            const data = await response.json();
            const post = (data.posts || []).find(item => item.slug === slug);

            if (!post) {
                showError("This article could not be found.");
                return;
            }

            document.title = post.title + " | Cygnus";

            const title = escapeHTML(post.title || "Untitled");
            const category = escapeHTML(post.category || "Insights");
            const date = post.date
                ? new Date(post.date).toLocaleDateString(undefined, {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                })
                : "";

            const cover = post.image
                ? `<img class="article-cover"
                     src="${escapeHTML(post.image)}"
                     alt="${title}">`
                : "";

            const articleBody = window.marked
                ? marked.parse(post.body || "")
                : `<p>${escapeHTML(post.body || "")}</p>`;

            container.innerHTML = `
                <p class="article-meta">${category}${date ? " · " + escapeHTML(date) : ""}</p>
                <h1>${title}</h1>
                ${cover}
                <div class="article-body">${articleBody}</div>
                <a class="article-back-link" href="blog.html">← Back to Blog</a>
                <section id="comments" class="comments-section">
                    <h2>Join the Conversation</h2>
                    <p>Comments will be available here once the comment service is connected.</p>
                </section>
            `;
        } catch (error) {
            console.error(error);
            showError("We couldn't load this article. Please try again later.");
        }

        function showError(message) {
            container.innerHTML = `
                <div class="article-error">
                    <h1>Article unavailable</h1>
                    <p>${escapeHTML(message)}</p>
                    <a class="article-back-link" href="blog.html">Back to Blog</a>
                </div>
            `;
        }
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    loadArticle();
    </script>

</body>
</html>
