
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cygnus | Article</title>
    <link rel="stylesheet" href="css/style.css">
    

<style>
    :root {
        --cygnus-green: #247747;
        --cygnus-dark: #10291b;
        --cygnus-ink: #18261d;
        --cygnus-muted: #68766c;
        --cygnus-line: #e4ebe5;
    }

    body {
        margin: 0;
        color: var(--cygnus-ink);
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(
                ellipse at 12% 8%,
                rgba(62, 139, 86, 0.42),
                transparent 34%
            ),
            radial-gradient(
                ellipse at 90% 45%,
                rgba(31, 100, 60, 0.38),
                transparent 32%
            ),
            linear-gradient(
                135deg,
                #0c2115 0%,
                #153c25 48%,
                #0d281a 100%
            );
        background-attachment: fixed;
        min-height: 100vh;
    }

    .article-page {
        box-sizing: border-box;
        max-width: 820px;
        margin: 54px auto 76px;
        padding: 44px 52px;
        background: rgba(255, 255, 255, 0.98);
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 16px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
        position: relative;
        overflow: hidden;
    }

    .article-page::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(
            90deg,
            #155b32,
            #58a66b,
            #c6a96b
        );
    }

    .article-meta {
        color: var(--cygnus-green);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        line-height: 1.7;
        text-transform: uppercase;
        margin: 0 0 16px;
    }

    .article-page h1 {
        color: var(--cygnus-dark);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(29px, 4vw, 42px);
        font-weight: 700;
        letter-spacing: -0.8px;
        line-height: 1.2;
        margin: 0 0 22px;
    }

    .article-cover {
        display: block;
        width: 100%;
        max-height: 350px;
        object-fit: cover;
        border-radius: 10px;
        margin: 25px 0 30px;
    }

    .article-body {
        color: #3d4940;
        font-size: 16px;
        line-height: 1.85;
        overflow-wrap: anywhere;
    }

    .article-body h2 {
        color: var(--cygnus-dark);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 25px;
        line-height: 1.35;
        margin: 32px 0 12px;
    }

    .article-body h3 {
        color: var(--cygnus-dark);
        font-size: 19px;
        margin: 25px 0 10px;
    }

    .article-body p {
        margin: 0 0 19px;
    }

    .article-body strong {
        color: var(--cygnus-dark);
    }

    .article-body ul,
    .article-body ol {
        padding-left: 24px;
        margin-bottom: 22px;
    }

    .article-body li {
        margin-bottom: 8px;
    }

    .article-back-link {
        display: inline-block;
        margin-top: 26px;
        padding: 11px 16px;
        border: 1px solid #dce7de;
        border-radius: 7px;
        color: var(--cygnus-green);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        transition: background 0.2s, color 0.2s;
    }

    .article-back-link:hover {
        color: white;
        background: var(--cygnus-green);
    }

    .comments-section {
        margin-top: 46px;
        padding-top: 27px;
        border-top: 1px solid var(--cygnus-line);
    }

    .comments-section h2 {
        color: var(--cygnus-dark);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 26px;
        margin: 0 0 10px;
    }

    .comments-section p {
        color: var(--cygnus-muted);
        line-height: 1.7;
    }

    .article-error {
        padding: 40px 10px;
        text-align: center;
    }

    @media (max-width: 650px) {
        .article-page {
            margin: 22px 12px 36px;
            padding: 32px 23px;
            border-radius: 12px;
        }

        .article-page h1 {
            font-size: 31px;
        }

        .article-body {
            font-size: 15px;
            line-height: 1.8;
        }

        .article-body h2 {
            font-size: 23px;
            margin-top: 28px;
        }
    }
</style>


</head>
<body>

    <main class="article-page" id="article">
        <p>Loading article...</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
    async function loadArticle() {
        const container = document.getElementById("article");
        const slug = new URLSearchParams(window.location.search).get("slug");

        if (!slug) {
            showError("No article was selected.");
            return;
        }

        try {
            const response = await fetch("data/posts.json");

            if (!response.ok) {
                throw new Error("Could not load posts.");
            }

            const data = await response.json();
            const post = (data.posts || []).find(item => item.slug === slug);

            if (!post) {
                showError("This article could not be found.");
                return;
            }

            document.title = post.title + " | Cygnus";

            const title = escapeHTML(post.title || "Untitled");
            const category = escapeHTML(post.category || "Insights");
            const date = post.date
                ? new Date(post.date).toLocaleDateString(undefined, {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                })
                : "";

            const cover = post.image
                ? `<img class="article-cover"
                     src="${escapeHTML(post.image)}"
                     alt="${title}">`
                : "";

            const rawBody = post.body || "";
            const cleanedBody = rawBody.replace(
                /^\s*#\s+.+(?:\r?\n)+/,
                ""
            );

const articleBody = window.marked
    ? marked.parse(cleanedBody)
    : `<p>${escapeHTML(cleanedBody)}</p>`;

            container.innerHTML = `
                <p class="article-meta">${category}${date ? " · " + escapeHTML(date) : ""}</p>
                <h1>${title}</h1>
                ${cover}
                <div class="article-body">${articleBody}</div>
                <a class="article-back-link" href="blog.html">← Back to Blog</a>
                <section id="comments" class="comments-section">
                    <h2>Join the Conversation</h2>
                    <p>Comments will be available here once the comment service is connected.</p>
                </section>
            `;
        } catch (error) {
            console.error(error);
            showError("We couldn't load this article. Please try again later.");
        }

        function showError(message) {
            container.innerHTML = `
                <div class="article-error">
                    <h1>Article unavailable</h1>
                    <p>${escapeHTML(message)}</p>
                    <a class="article-back-link" href="blog.html">Back to Blog</a>
                </div>
            `;
        }
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    loadArticle();
    </script>

</body>
</html>
