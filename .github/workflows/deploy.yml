
name: Deploy Cygnus to HostHike

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Upload website to HostHike
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v6

      - name: Deploy using FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
